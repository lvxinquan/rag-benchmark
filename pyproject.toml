[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rag-benchmark"
version = "0.1.0"
description = "An open-source benchmark toolkit for evaluating Retrieval-Augmented Generation systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xinquan Lv" }]
keywords = ["rag", "retrieval", "evaluation", "benchmark", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_benchmark"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--cov=rag_benchmark",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rag_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

